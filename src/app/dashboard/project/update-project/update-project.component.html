<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-2xl mx-auto px-4">
    <!-- Loader -->
    <div *ngIf="isLoading" class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
      <div class="flex justify-center items-center">
        <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="ml-3 text-gray-600">Loading project...</span>
      </div>
    </div>

    <!-- Form Content -->
    <div *ngIf="!isLoading">
      <!-- Header -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
        <h1 class="text-2xl font-semibold text-gray-900">{{ pageTitle }}</h1>
        <p class="mt-1 text-sm text-gray-600">Update the project information below</p>
      </div>

      <!-- Form -->
      <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
        <div class="space-y-6">
          <!-- Project Title -->
          <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">
              Project Title <span class="text-red-500">*</span>
            </label>
            <input 
              type="text" 
              id="title"
              formControlName="title" 
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="e.g., Highway Rehabilitation Project"
            >
            <div *ngIf="projectForm.get('title')?.invalid && projectForm.get('title')?.touched" 
                 class="mt-1 text-sm text-red-600">
              Project title is required (minimum 3 characters)
            </div>
          </div>

          <!-- Description -->
          <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
              Description <span class="text-red-500">*</span>
            </label>
            <textarea 
              id="description"
              formControlName="description" 
              rows="4"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Provide a brief description of the project objectives and scope"
            ></textarea>
            <div *ngIf="projectForm.get('description')?.invalid && projectForm.get('description')?.touched" 
                 class="mt-1 text-sm text-red-600">
              Description is required (minimum 10 characters)
            </div>
          </div>

          <!-- Type, Sector and Status Row -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Project Type -->
            <div>
              <label for="type" class="block text-sm font-medium text-gray-700 mb-1">
                Project Type <span class="text-red-500">*</span>
              </label>
              <select 
                id="type"
                formControlName="type"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              >
                <option value="construction">Construction</option>
                <option value="rehabilitation">Rehabilitation</option>
                <option value="replacement">Replacement</option>
                <option value="expansion">Expansion</option>
                <option value="maintenance">Maintenance</option>
              </select>
            </div>

            <!-- Sector -->
            <div>
              <label for="sector" class="block text-sm font-medium text-gray-700 mb-1">
                Sector <span class="text-red-500">*</span>
              </label>
              <select 
                id="sector"
                formControlName="sector"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              >
                <option value="">Select a sector</option>
                <option value="transport">Transport</option>
                <option value="energy">Energy</option>
                <option value="water">Water & Sanitation</option>
                <option value="health">Health</option>
                <option value="education">Education</option>
                <option value="communications">Communications</option>
                <option value="socialHousing">Social Housing</option>
                <option value="governance">Governance</option>
              </select>
              <div *ngIf="projectForm.get('sector')?.invalid && projectForm.get('sector')?.touched" 
                   class="mt-1 text-sm text-red-600">
                Please select a sector
              </div>
            </div>

            <!-- Status -->
            <div>
              <label for="status" class="block text-sm font-medium text-gray-700 mb-1">
                Status <span class="text-red-500">*</span>
              </label>
              <select 
                id="status"
                formControlName="status"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              >
                <option value="identification">Identification</option>
                <option value="preparation">Preparation</option>
                <option value="implementation">Implementation</option>
                <option value="completion">Completion</option>
                <option value="maintenance">Maintenance</option>
                <option value="decommissioning">Decommissioning</option>
              </select>
            </div>
          </div>

          <!-- Budget Section -->
          <div formGroupName="budget" class="border-t pt-6">
            <h3 class="text-sm font-medium text-gray-700 mb-4">Budget Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- Amount -->
              <div>
                <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">
                  Budget Amount <span class="text-red-500">*</span>
                </label>
                <input 
                  type="number" 
                  id="amount"
                  formControlName="amount"
                  min="0"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  placeholder="0"
                >
                <div *ngIf="projectForm.get('budget.amount')?.invalid && projectForm.get('budget.amount')?.touched" 
                     class="mt-1 text-sm text-red-600">
                  Valid budget amount is required
                </div>
              </div>

              <!-- Currency -->
              <div>
                <label for="currency" class="block text-sm font-medium text-gray-700 mb-1">
                  Currency <span class="text-red-500">*</span>
                </label>
                <select 
                  id="currency"
                  formControlName="currency"
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
                  <option value="USD">USD - US Dollar</option>
                  <option value="EUR">EUR - Euro</option>
                  <option value="GBP">GBP - British Pound</option>
                  <option value="MZN">MZN - Mozambican Metical</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Form Actions -->
        <div class="mt-8 pt-6 border-t flex justify-end space-x-3">
          <button 
            type="button"
            (click)="cancel()"
            [disabled]="isSaving"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Cancel
          </button>
          <button 
            type="submit"
            [disabled]="projectForm.invalid || isSaving"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span *ngIf="!isSaving">Update Project</span>
            <span *ngIf="isSaving" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Updating...
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
