<!-- Main Container -->
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <!-- Registration Card -->
        <div class="bg-white py-8 px-4 shadow-lg sm:rounded-lg sm:px-10">
            <!-- Header -->
            <div class="mb-8">
                <h2 class="text-center text-2xl font-bold text-gray-900">
                    Create your account
                </h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Join us to get started
                </p>
            </div>
            <!-- Registration Form -->
            <form [formGroup]="registerForm" (ngSubmit)="register()" class="space-y-6">
                <!-- Error Message -->
                <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-md">
                    <p class="text-sm text-red-600">{{ errorMessage }}</p>
                </div>

                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">
                        Full Name
                    </label>
                    <div class="mt-1">
                        <input 
                            type="text" 
                            id="name"
                            formControlName="name"
                            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-accent-color-base focus:border-accent-color-base focus:z-10 sm:text-sm"
                            [class.border-red-300]="isFieldInvalid('name')"
                            placeholder="Enter your full name"
                        >
                    </div>
                    <div *ngIf="isFieldInvalid('name')" class="text-xs text-red-600 mt-1">
                        {{ getFieldError('name') }}
                    </div>
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">
                        Email Address
                    </label>
                    <div class="mt-1">
                        <input 
                            type="email" 
                            id="email"
                            formControlName="email"
                            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-accent-color-base focus:border-accent-color-base focus:z-10 sm:text-sm"
                            [class.border-red-300]="isFieldInvalid('email')"
                            placeholder="Enter your email"
                        >
                    </div>
                    <div *ngIf="isFieldInvalid('email')" class="text-xs text-red-600 mt-1">
                        {{ getFieldError('email') }}
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        Password
                    </label>
                    <div class="mt-1">
                        <input 
                            type="password" 
                            id="password"
                            formControlName="password"
                            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-accent-color-base focus:border-accent-color-base focus:z-10 sm:text-sm"
                            [class.border-red-300]="isFieldInvalid('password')"
                            placeholder="Create a password"
                        >
                    </div>
                    <div *ngIf="isFieldInvalid('password')" class="text-xs text-red-600 mt-1">
                        {{ getFieldError('password') }}
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700">
                        Confirm Password
                    </label>
                    <div class="mt-1">
                        <input 
                            type="password" 
                            id="confirmPassword"
                            formControlName="confirmPassword"
                            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-accent-color-base focus:border-accent-color-base focus:z-10 sm:text-sm"
                            [class.border-red-300]="isFieldInvalid('confirmPassword')"
                            placeholder="Confirm your password"
                        >
                    </div>
                    <div *ngIf="isFieldInvalid('confirmPassword')" class="text-xs text-red-600 mt-1">
                        {{ getFieldError('confirmPassword') }}
                    </div>
                </div>

                <!-- Submit Button -->
                <div>
                    <button 
                        type="submit"
                        [disabled]="!registerForm.valid || isLoading"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-accent-color-base hover:bg-accent-color-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-color-base disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
                    >
                        <span *ngIf="!isLoading">Create Account</span>
                        <span *ngIf="isLoading" class="flex items-center">
                            <i class="bi bi-arrow-repeat animate-spin mr-2"></i>
                            Creating account...
                        </span>
                    </button>
                </div>
                <!-- Already have an account -->
                <div class="text-center">
                    <p class="text-sm text-gray-600">
                        Already have an account?
                        <a routerLink="../login" class="font-medium text-accent-color-base hover:text-accent-color-dark">
                            Sign in here
                        </a>
                    </p>
                </div>

                <!-- Back to Home -->
                <div class="text-center">
                    <a routerLink="/" class="text-sm text-gray-600 hover:text-gray-900">
                        <i class="bi bi-arrow-left mr-1"></i>
                        Back to Home
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
