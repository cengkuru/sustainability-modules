<!-- Main Container -->
<div class="min-h-screen bg-gradient-to-b from-neutral-50 to-white font-['SF Pro Display', 'Inter', system-ui] text-neutral-700">
    <main class="container mx-auto px-4 py-12 max-w-md">
        <!-- Header Section -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-light tracking-tight mb-2">Create Account</h1>
            <p class="text-neutral-500 text-base font-light leading-relaxed">
                Sign up to get started with your new account
            </p>
        </header>

        <!-- Registration Form Card -->
        <div class="bg-white/90 backdrop-blur-xl rounded-2xl shadow-sm p-6 border border-neutral-200">
            <form [formGroup]="registerForm" (ngSubmit)="register()" class="space-y-5">
                <!-- Error Message -->
                <div *ngIf="errorMessage" 
                     class="p-3 bg-status-other/10 border border-status-other rounded-xl animate-fade-in">
                    <p class="text-sm text-status-other flex items-center gap-2">
                        <i class="bi bi-exclamation-circle"></i>
                        {{ errorMessage }}
                    </p>
                </div>

                <!-- Name Field -->
                <div class="space-y-1.5">
                    <label for="name" class="block text-sm font-light text-neutral-700">Full Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="bi bi-person text-neutral-400"></i>
                        </div>
                        <input 
                            type="text" 
                            id="name"
                            formControlName="name"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-neutral-200 bg-white text-neutral-700 text-sm font-light transition-all duration-300 focus:border-accent-color-base focus:ring-2 focus:ring-accent-color-base/20 outline-none"
                            placeholder="Enter your full name"
                        >
                    </div>
                    <div *ngIf="isFieldInvalid('name')" class="mt-1 text-xs text-status-other">
                        {{ getFieldError('name') }}
                    </div>
                </div>

                <!-- Email Field -->
                <div class="space-y-1.5">
                    <label for="email" class="block text-sm font-light text-neutral-700">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="bi bi-envelope text-neutral-400"></i>
                        </div>
                        <input 
                            type="email" 
                            id="email"
                            formControlName="email"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-neutral-200 bg-white text-neutral-700 text-sm font-light transition-all duration-300 focus:border-accent-color-base focus:ring-2 focus:ring-accent-color-base/20 outline-none"
                            placeholder="Enter your email"
                        >
                    </div>
                    <div *ngIf="isFieldInvalid('email')" class="mt-1 text-xs text-status-other">
                        {{ getFieldError('email') }}
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-1.5">
                    <label for="password" class="block text-sm font-light text-neutral-700">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="bi bi-lock text-neutral-400"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password"
                            formControlName="password"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-neutral-200 bg-white text-neutral-700 text-sm font-light transition-all duration-300 focus:border-accent-color-base focus:ring-2 focus:ring-accent-color-base/20 outline-none"
                            placeholder="Create a password"
                        >
                    </div>
                    <div *ngIf="isFieldInvalid('password')" class="mt-1 text-xs text-status-other">
                        {{ getFieldError('password') }}
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="space-y-1.5">
                    <label for="confirmPassword" class="block text-sm font-light text-neutral-700">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="bi bi-lock-fill text-neutral-400"></i>
                        </div>
                        <input 
                            type="password" 
                            id="confirmPassword"
                            formControlName="confirmPassword"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-neutral-200 bg-white text-neutral-700 text-sm font-light transition-all duration-300 focus:border-accent-color-base focus:ring-2 focus:ring-accent-color-base/20 outline-none"
                            placeholder="Confirm your password"
                        >
                    </div>
                    <div *ngIf="isFieldInvalid('confirmPassword')" class="mt-1 text-xs text-status-other">
                        {{ getFieldError('confirmPassword') }}
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit"
                    [disabled]="!registerForm.valid || isLoading"
                    class="w-full px-4 py-2.5 bg-black text-white text-sm font-light rounded-xl transition-all duration-300 hover:bg-neutral-800 disabled:bg-neutral-200 disabled:text-neutral-500 disabled:cursor-not-allowed"
                >
                    <span *ngIf="!isLoading" class="flex items-center justify-center gap-2">
                        Create Account
                    </span>
                    <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
                        <i class="bi bi-arrow-repeat animate-spin"></i>
                        Creating account...
                    </span>
                </button>
            </form>

            <!-- Already have an account -->
            <div class="mt-6 text-center">
                <p class="text-sm text-neutral-500">
                    Already have an account?
                    <a 
                        routerLink="../login" 
                        class="text-black font-medium hover:text-accent-color-base transition-colors duration-300"
                    >
                        Sign In
                    </a>
                </p>
            </div>

            <!-- Back to Home Link -->
            <div class="mt-5 text-center">
                <a 
                    routerLink="/" 
                    class="text-sm text-neutral-500 hover:text-accent-color-base transition-colors duration-300 flex items-center justify-center gap-2"
                >
                    <i class="bi bi-arrow-left"></i>
                    Back to Home
                </a>
            </div>
        </div>
    </main>
</div>

<style>
.animate-fade-in {
    animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>
