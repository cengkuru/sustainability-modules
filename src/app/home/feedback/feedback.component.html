<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-16 bg-primary-100 dark:bg-background-dark font-inter">
    <div class="lg:flex lg:items-start lg:justify-between">
        <div class="lg:w-1/2 lg:pr-16">
            <h2 class="text-3xl md:text-4xl font-bold text-accent-300 dark:text-text-dark mb-6 leading-tight">We're here to help</h2>
            <p class="text-lg text-accent-200 dark:text-text-dark mb-10">We value your feedback and inquiries. Whether you have questions about our OC4IDS standard, need support with implementation, or want to share your thoughts, we're here to assist you.</p>

            <div class="space-y-8">
                <div *ngFor="let contact of contacts; let i = index" class="flex items-center space-x-4 animate-apple-fade-in" [style.animation-delay]="i * 100 + 'ms'">
                    <div class="w-12 h-12 rounded-full bg-accent2 dark:bg-accent-400 flex items-center justify-center transition-all duration-300 ease-apple group-hover:bg-accent6">
                        <i class="bi bi-geo-alt text-xl text-accent-300 dark:text-text-dark transition-colors duration-300 ease-apple group-hover:text-primary-100"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-accent-300 dark:text-text-dark">{{ contact.address }}</p>
                    </div>
                </div>

                <div *ngFor="let contact of contacts; let i = index" class="flex items-center space-x-4 animate-apple-fade-in" [style.animation-delay]="(i + 1) * 100 + 'ms'">
                    <div class="w-12 h-12 rounded-full bg-accent2 dark:bg-accent-400 flex items-center justify-center transition-all duration-300 ease-apple group-hover:bg-accent6">
                        <i class="bi bi-telephone text-xl text-accent-300 dark:text-text-dark transition-colors duration-300 ease-apple group-hover:text-primary-100"></i>
                    </div>
                    <div>
                        <a href="tel:{{ contact.phone }}" class="font-semibold text-accent-300 dark:text-text-dark hover:text-secondary-300 dark:hover:text-secondary-200 transition-colors duration-300 ease-apple">{{ contact.phone }}</a>
                    </div>
                </div>

                <div *ngFor="let contact of contacts; let i = index" class="flex items-center space-x-4 animate-apple-fade-in" [style.animation-delay]="(i + 2) * 100 + 'ms'">
                    <div class="w-12 h-12 rounded-full bg-accent2 dark:bg-accent-400 flex items-center justify-center transition-all duration-300 ease-apple group-hover:bg-accent6">
                        <i class="bi bi-envelope text-xl text-accent-300 dark:text-text-dark transition-colors duration-300 ease-apple group-hover:text-primary-100"></i>
                    </div>
                    <div>
                        <a href="mailto:{{ contact.email }}" class="font-semibold text-accent-300 dark:text-text-dark hover:text-secondary-300 dark:hover:text-secondary-200 transition-colors duration-300 ease-apple">{{ contact.email }}</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:w-1/2 mt-16 lg:mt-0">
            <form action="#" method="POST" class="space-y-8 bg-white dark:bg-accent-400 p-8 rounded-apple-lg shadow-apple-lg transition-all duration-300 ease-apple hover:shadow-apple-xl">
                <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-8">
                    <div class="relative">
                        <label for="first-name" class="absolute -top-2 left-2 inline-block px-1 bg-white dark:bg-accent-400 text-xs font-medium text-accent-200 dark:text-text-dark transition-all duration-300 ease-apple">First name</label>
                        <input type="text" name="first-name" id="first-name" autocomplete="given-name" class="block w-full px-4 py-3 rounded-apple border-accent2 dark:border-accent-300 bg-transparent text-accent-300 dark:text-text-dark placeholder-accent-100 focus:ring-2 focus:ring-accent6 focus:border-transparent transition-all duration-300 ease-apple">
                    </div>
                    <div class="relative">
                        <label for="last-name" class="absolute -top-2 left-2 inline-block px-1 bg-white dark:bg-accent-400 text-xs font-medium text-accent-200 dark:text-text-dark transition-all duration-300 ease-apple">Last name</label>
                        <input type="text" name="last-name" id="last-name" autocomplete="family-name" class="block w-full px-4 py-3 rounded-apple border-accent2 dark:border-accent-300 bg-transparent text-accent-300 dark:text-text-dark placeholder-accent-100 focus:ring-2 focus:ring-accent6 focus:border-transparent transition-all duration-300 ease-apple">
                    </div>
                </div>
                <div class="relative">
                    <label for="email" class="absolute -top-2 left-2 inline-block px-1 bg-white dark:bg-accent-400 text-xs font-medium text-accent-200 dark:text-text-dark transition-all duration-300 ease-apple">Email</label>
                    <input type="email" name="email" id="email" autocomplete="email" class="block w-full px-4 py-3 rounded-apple border-accent2 dark:border-accent-300 bg-transparent text-accent-300 dark:text-text-dark placeholder-accent-100 focus:ring-2 focus:ring-accent6 focus:border-transparent transition-all duration-300 ease-apple">
                </div>
                <div class="relative">
                    <label for="message" class="absolute -top-2 left-2 inline-block px-1 bg-white dark:bg-accent-400 text-xs font-medium text-accent-200 dark:text-text-dark transition-all duration-300 ease-apple">Message</label>
                    <textarea name="message" id="message" rows="4" class="block w-full px-4 py-3 rounded-apple border-accent2 dark:border-accent-300 bg-transparent text-accent-300 dark:text-text-dark placeholder-accent-100 focus:ring-2 focus:ring-accent6 focus:border-transparent transition-all duration-300 ease-apple"></textarea>
                </div>
                <div>
                    <button type="submit" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-apple text-sm font-medium text-primary-100 bg-secondary-400 hover:bg-secondary-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent6 transition-all duration-300 ease-apple transform hover:scale-105 active:scale-95">
                        Send message
                        <i class="bi bi-arrow-right ml-2 transition-transform duration-300 ease-apple group-hover:translate-x-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
