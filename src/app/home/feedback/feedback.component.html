<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-12 bg-primary font-inter">
    <div class="lg:flex lg:items-start lg:justify-between">
        <div class="lg:w-1/2 lg:pr-12">
            <h2 class="text-4xl font-bold text-accent mb-6">We're here to help</h2>
            <p class="text-lg text-accent3 mb-8">We value your feedback and inquiries. Whether you have questions about our OC4IDS standard, need support with implementation, or want to share your thoughts, we're here to assist you.</p>

            <div class="space-y-6">
                <div *ngFor="let contact of contacts" class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-full bg-accent2 flex items-center justify-center">
                        <i class="bi bi-geo-alt text-xl text-accent"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-accent">{{ contact.address }}</p>
                    </div>
                </div>

                <div *ngFor="let contact of contacts" class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-full bg-accent2 flex items-center justify-center">
                        <i class="bi bi-telephone text-xl text-accent"></i>
                    </div>
                    <div>
                        <a href="tel:{{ contact.phone }}" class="font-semibold text-accent hover:text-secondary transition-colors duration-300 ease-apple-ease-out">{{ contact.phone }}</a>
                    </div>
                </div>

                <div *ngFor="let contact of contacts" class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-full bg-accent2 flex items-center justify-center">
                        <i class="bi bi-envelope text-xl text-accent"></i>
                    </div>
                    <div>
                        <a href="mailto:{{ contact.email }}" class="font-semibold text-accent hover:text-secondary transition-colors duration-300 ease-apple-ease-out">{{ contact.email }}</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:w-1/2 mt-12 lg:mt-0">
            <form action="#" method="POST" class="space-y-6 bg-white p-8 rounded-apple-lg shadow-apple-md">
                <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-8">
                    <div>
                        <label for="first-name" class="block text-sm font-medium text-accent3">First name</label>
                        <input type="text" name="first-name" id="first-name" autocomplete="given-name" class="mt-1 block w-full rounded-apple-md border-accent2 shadow-apple-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50 transition duration-300 ease-apple-ease-out">
                    </div>
                    <div>
                        <label for="last-name" class="block text-sm font-medium text-accent3">Last name</label>
                        <input type="text" name="last-name" id="last-name" autocomplete="family-name" class="mt-1 block w-full rounded-apple-md border-accent2 shadow-apple-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50 transition duration-300 ease-apple-ease-out">
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-accent3">Email</label>
                    <input type="email" name="email" id="email" autocomplete="email" class="mt-1 block w-full rounded-apple-md border-accent2 shadow-apple-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50 transition duration-300 ease-apple-ease-out">
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-accent3">Message</label>
                    <textarea name="message" id="message" rows="4" class="mt-1 block w-full rounded-apple-md border-accent2 shadow-apple-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50 transition duration-300 ease-apple-ease-out"></textarea>
                </div>
                <div>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-apple-md shadow-apple-sm text-sm font-medium text-primary bg-secondary hover:bg-accent focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent6 transition duration-300 ease-apple-ease-out apple-press-effect">
                        Send message
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
