<div class="mx-auto max-w-4xl px-4 sm:px-6 py-16 ">

    <div class="bg-white dark:bg-accent4 p-8 rounded-apple-lg shadow-apple-md transition-all duration-300 ease-apple-ease-out hover:shadow-apple-lg">
        <form action="#" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-8">
                <div class="relative">
                    <label for="first-name" class="block text-sm font-medium text-accent-400 dark:text-accent5 mb-1">First name</label>
                    <input type="text" name="first-name" id="first-name" autocomplete="given-name" class="block w-full px-4 py-3 rounded-apple-md border-accent2 dark:border-accent5 bg-transparent text-accent dark:text-primary placeholder-accent-300 dark:placeholder-accent5 focus:ring-2 focus:ring-accent6 focus:border-transparent transition-all duration-300 ease-apple-ease-out" required aria-required="true">
                </div>
                <div class="relative">
                    <label for="last-name" class="block text-sm font-medium text-accent-400 dark:text-accent5 mb-1">Last name</label>
                    <input type="text" name="last-name" id="last-name" autocomplete="family-name" class="block w-full px-4 py-3 rounded-apple-md border-accent2 dark:border-accent5 bg-transparent text-accent dark:text-primary placeholder-accent-300 dark:placeholder-accent5 focus:ring-2 focus:ring-accent6 focus:border-transparent transition-all duration-300 ease-apple-ease-out" required aria-required="true">
                </div>
            </div>
            <div class="relative">
                <label for="email" class="block text-sm font-medium text-accent-400 dark:text-accent5 mb-1">Email</label>
                <input type="email" name="email" id="email" autocomplete="email" class="block w-full px-4 py-3 rounded-apple-md border-accent2 dark:border-accent5 bg-transparent text-accent dark:text-primary placeholder-accent-300 dark:placeholder-accent5 focus:ring-2 focus:ring-accent6 focus:border-transparent transition-all duration-300 ease-apple-ease-out" required aria-required="true">
            </div>
            <div class="relative">
                <label for="message" class="block text-sm font-medium text-accent-400 dark:text-accent5 mb-1">Message</label>
                <textarea name="message" id="message" rows="4" class="block w-full px-4 py-3 rounded-apple-md border-accent2 dark:border-accent5 bg-transparent text-accent dark:text-primary placeholder-accent-300 dark:placeholder-accent5 focus:ring-2 focus:ring-accent6 focus:border-transparent transition-all duration-300 ease-apple-ease-out" required aria-required="true"></textarea>
            </div>
            <div>
                <button type="submit" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-apple-md text-base font-medium text-primary bg-accent6 hover:bg-accent5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent6 transition-all duration-300 ease-apple-ease-out transform hover:scale-102 active:scale-98 min-h-[44px]">
                    Send message
                    <svg class="ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <div class="mt-12 flex justify-center space-x-6">
        <a href="tel:+1234567890" class="group">
            <span class="sr-only">Call us</span>
            <div class="flex items-center justify-center h-12 w-12 rounded-full bg-white dark:bg-accent4 shadow-apple-sm transition-all duration-300 ease-apple-ease-out group-hover:shadow-apple-md group-hover:scale-105">
                <svg class="h-6 w-6 text-accent6 group-hover:text-accent5 transition-colors duration-300 ease-apple-ease-out" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                </svg>
            </div>
        </a>
        <a href="mailto:contact@example.com" class="group">
            <span class="sr-only">Email us</span>
            <div class="flex items-center justify-center h-12 w-12 rounded-full bg-white dark:bg-accent4 shadow-apple-sm transition-all duration-300 ease-apple-ease-out group-hover:shadow-apple-md group-hover:scale-105">
                <svg class="h-6 w-6 text-accent6 group-hover:text-accent5 transition-colors duration-300 ease-apple-ease-out" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </div>
        </a>
    </div>
</div>
