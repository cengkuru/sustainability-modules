<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-12 bg-primary font-inter">
    <div class="lg:flex lg:items-center lg:justify-between">
        <div class="lg:w-1/2 lg:pr-12">
            <h2 class="text-4xl font-bold text-accent mb-6">We're here to help</h2>
            <p class="text-lg text-accent mb-8">We value your feedback and inquiries. Whether you have questions about our OC4IDS standard, need support with implementation, or want to share your thoughts, we're here to assist you.</p>

            <div class="space-y-6">
                <div *ngFor="let contact of contacts" class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-full bg-accent1 flex items-center justify-center">
                        <svg class="h-5 w-5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                    </div>
                    <div>
                        <p class="font-semibold text-accent">{{ contact.address }}</p>
                    </div>
                </div>

                <div *ngFor="let contact of contacts" class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-full bg-accent1 flex items-center justify-center">
                        <svg class="h-5 w-5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                    </div>
                    <div>
                        <a href="tel:{{ contact.phone }}" class="font-semibold text-accent hover:text-secondary transition-colors duration-300">{{ contact.phone }}</a>
                    </div>
                </div>

                <div *ngFor="let contact of contacts" class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-full bg-accent1 flex items-center justify-center">
                        <svg class="h-5 w-5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div>
                        <a href="mailto:{{ contact.email }}" class="font-semibold text-accent hover:text-secondary transition-colors duration-300">{{ contact.email }}</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:w-1/2 mt-12 lg:mt-0">
            <form action="#" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-8">
                    <div>
                        <label for="first-name" class="block text-sm font-medium text-accent">First name</label>
                        <input type="text" name="first-name" id="first-name" autocomplete="given-name" class="mt-1 block w-full rounded-apple-md border-accent2 shadow-apple-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50 transition duration-300">
                    </div>
                    <div>
                        <label for="last-name" class="block text-sm font-medium text-accent">Last name</label>
                        <input type="text" name="last-name" id="last-name" autocomplete="family-name" class="mt-1 block w-full rounded-apple-md border-accent2 shadow-apple-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50 transition duration-300">
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-accent">Email</label>
                    <input type="email" name="email" id="email" autocomplete="email" class="mt-1 block w-full rounded-apple-md border-accent2 shadow-apple-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50 transition duration-300">
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-accent">Message</label>
                    <textarea name="message" id="message" rows="4" class="mt-1 block w-full rounded-apple-md border-accent2 shadow-apple-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50 transition duration-300"></textarea>
                </div>
                <div>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-apple-md shadow-apple-sm text-sm font-medium text-primary bg-accent hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent6 transition duration-300 apple-press-effect">
                        Send message
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
