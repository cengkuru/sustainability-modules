<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 font-inter">
    <!-- Loading State -->
    <div *ngIf="isLoading" class="fixed inset-0 flex items-center justify-center bg-primary bg-opacity-75 backdrop-blur-sm z-50" @fadeInAnimation>
        <div class="w-16 h-16 border-4 border-accent2 border-t-accent rounded-full animate-spin"></div>
    </div>

    <div class="bg-primary rounded-2xl shadow-apple-lg overflow-hidden" *ngIf="project$ | async as project">
        <!-- Project Header -->
        <div class="bg-accent2 bg-opacity-10 p-8">
            <h2 class="text-3xl font-bold text-accent mb-4">
                {{ project.name }}
            </h2>
            <p class="text-accent4 text-lg">{{ project.stages.identification.basicData.projectDescription }}</p>
        </div>

        <!-- Navigation and Controls -->
        <div class="border-b border-accent2 px-8 py-4 flex flex-wrap items-center justify-between gap-4">
            <!-- Stage Selection for larger screens -->
            <div class="hidden lg:flex space-x-2 overflow-x-auto">
                <button *ngFor="let stage of stages"
                        (click)="selectTab(stage.id)"
                        class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-250 ease-apple-ease whitespace-nowrap"
                        [ngClass]="{'bg-accent1 text-accent': selectedTab === stage.id, 'text-accent4 hover:bg-accent2 hover:bg-opacity-20': selectedTab !== stage.id}">
                    <i [class]="stage.icon + ' mr-2'"></i>{{ stage.label }}
                </button>
            </div>

            <!-- Dropdown for mobile view -->
            <select
                    class="lg:hidden w-full px-4 py-2 rounded-full bg-accent2 bg-opacity-10 border-none text-accent focus:outline-none focus:ring-2 focus:ring-accent1"
                    (change)="onTabChange($event)"
            >
                <option *ngFor="let stage of stages" [value]="stage.id">{{ stage.label }}</option>
            </select>

            <!-- Project Navigation -->
            <div class="flex space-x-4">
                <button
                        *ngIf="(previousProject$ | async) as previousProject"
                        (click)="navigateToProject(previousProject)"
                        class="px-4 py-2 bg-accent2 bg-opacity-20 text-accent rounded-full hover:bg-opacity-30 transition-all duration-250 ease-apple-ease"
                >
                    Previous Project
                </button>
                <button
                        *ngIf="(nextProject$ | async) as nextProject"
                        (click)="navigateToProject(nextProject)"
                        class="px-4 py-2 bg-accent1 text-accent rounded-full hover:bg-opacity-90 transition-all duration-250 ease-apple-ease"
                >
                    Next Project
                </button>
            </div>
        </div>

        <!-- Project Content -->
        <div class="p-8">
            <ng-container [ngSwitch]="selectedTab">
                <div *ngSwitchCase="'Identification'" @fadeSlideInOut>
                    <!-- Basic Data Section -->
                    <section class="bg-accent2 bg-opacity-5 rounded-2xl overflow-hidden mb-8">
                        <div class="p-6">
                            <h3 class="text-xl font-semibold text-accent mb-6 flex items-center">
                                <i class="bi bi-info-circle-fill mr-2 text-accent6"></i>Basic Data
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div *ngFor="let item of getBasicDataItems(project.stages.identification.basicData) | keyvalue" class="space-y-2">
                                    <p class="text-sm font-medium text-accent4">{{item.key}}</p>
                                    <p class="text-base text-accent">{{item.value}}</p>
                                </div>
                            </div>
                            <app-attachment-list [attachments]="project.stages.identification.basicData.attachments" class="mt-6"></app-attachment-list>
                        </div>
                    </section>

                    <!-- Climate Finance Data Section -->
                    <section class="bg-accent2 bg-opacity-5 rounded-2xl overflow-hidden mb-8">
                        <div class="p-6">
                            <h3 class="text-xl font-semibold text-accent mb-6 flex items-center">
                                <i class="bi bi-leaf-fill mr-2 text-accent6"></i>Climate Finance Data
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div *ngFor="let item of getClimateFinanceDataItems(project.stages.identification.climateFinanceData) | keyvalue" class="space-y-2">
                                    <p class="text-sm font-medium text-accent4">{{item.key}}</p>
                                    <p class="text-base text-accent">{{item.value}}</p>
                                </div>
                            </div>
                            <app-attachment-list [attachments]="project.stages.identification.climateFinanceData.attachments" class="mt-6"></app-attachment-list>
                        </div>
                    </section>

                    <!-- Institutional Sustainability Data Section -->
                    <section class="bg-accent2 bg-opacity-5 rounded-2xl overflow-hidden">
                        <div class="p-6">
                            <h3 class="text-xl font-semibold text-accent mb-6 flex items-center">
                                <i class="bi bi-building-fill mr-2 text-accent6"></i>Institutional Sustainability Data
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div *ngFor="let item of getInstitutionalSustainabilityDataItems(project.stages.identification.institutionalSustainabilityData) | keyvalue" class="space-y-2">
                                    <p class="text-sm font-medium text-accent4">{{item.key}}</p>
                                    <p class="text-base text-accent">{{item.value}}</p>
                                </div>
                            </div>
                            <app-attachment-list [attachments]="project.stages.identification.institutionalSustainabilityData.attachments" class="mt-6"></app-attachment-list>
                        </div>
                    </section>
                </div>

                <!-- Repeat similar structure for other stages (Preparation, TenderManagement, etc.) -->
                <!-- For brevity, I'm not including all stages here, but you would follow the same pattern -->

            </ng-container>
        </div>
    </div>
</div>
