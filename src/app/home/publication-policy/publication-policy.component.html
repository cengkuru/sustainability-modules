<div class="bg-primary min-h-screen font-sans text-accent3">
    <!-- Mobile Sidebar Toggle -->
    <button
            (click)="toggleSidebar()"
            class="md:hidden fixed top-4 left-4 z-50 bg-accent6 text-primary p-2 rounded-full shadow-apple-md transition duration-250 ease-apple-ease-out hover:bg-accent6/90 active:scale-95 focus:outline-none focus:ring-2 focus:ring-accent6 focus:ring-offset-2"
            aria-label="Toggle sidebar"
    >
        <i class="bi" [ngClass]="{'bi-list': !isSidebarOpen, 'bi-x': isSidebarOpen}"></i>
    </button>

    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside
                [@sidebarAnimation]="isSidebarOpen ? 'open' : 'closed'"
                class="w-full md:w-72 lg:w-80 bg-primary fixed md:sticky top-0 h-screen overflow-y-auto transition-all duration-300 ease-apple-ease-out z-40 md:translate-x-0 shadow-apple-lg md:shadow-none"
                [ngClass]="{'translate-x-0': isSidebarOpen, '-translate-x-full md:translate-x-0': !isSidebarOpen}"
        >
            <div class="p-6 space-y-6">
                <h2 class="text-2xl font-bold text-accent3 mb-4">Publication Policy</h2>
                <!-- Search Bar -->
                <div class="relative">
                    <i class="bi bi-search absolute left-3 top-1/2 transform -translate-y-1/2 text-accent4"></i>
                    <input
                            type="text"
                            [(ngModel)]="searchTerm"
                            placeholder="Search policy..."
                            class="w-full p-3 pl-10 rounded-apple-md border border-accent2 focus:outline-none focus:ring-2 focus:ring-accent6 bg-primary text-accent3 placeholder-accent4 transition-all duration-250 ease-apple"
                    >
                </div>

                <!-- Navigation -->
                <nav>
                    <ul [@listAnimation]="filteredSections.length" class="space-y-2">
                        <li *ngFor="let section of filteredSections"
                            (click)="setActiveSection(section.title)"
                            class="cursor-pointer rounded-apple-md transition-all duration-250 ease-apple"
                            [ngClass]="{'bg-accent6 text-primary shadow-apple-md': activeSection === section.title, 'hover:bg-accent2 hover:text-accent': activeSection !== section.title}"
                        >
                            <a class="block text-black px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent6 focus:ring-offset-2 rounded-apple-md">
                                {{ section.title }}
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-8 mt-16 md:mt-0 bg-primary">
            <ng-container *ngFor="let section of filteredSections">
                <section *ngIf="activeSection === section.title" [@fadeInOut] class="max-w-3xl mx-auto space-y-8">
                    <header class="border-b border-accent2 pb-4">
                        <h1 class="text-4xl font-bold mb-4 text-accent3">{{ section.title }}</h1>
                    </header>

                    <p class="text-lg text-accent4 leading-relaxed">{{ section.content }}</p>

                    <ng-container *ngIf="section.subsections">
                        <div *ngFor="let subsection of section.subsections" class="bg-primary-100 p-6 rounded-apple-lg shadow-apple-sm space-y-3 transition-all duration-250 ease-apple hover:shadow-apple-md">
                            <h2 class="text-xl font-semibold text-accent3 flex items-center">
                                <i class="bi bi-info-circle mr-2 text-accent6"></i>
                                {{ subsection.title }}
                            </h2>
                            <p class="text-accent4 leading-relaxed">{{ subsection.content }}</p>
                        </div>
                    </ng-container>
                </section>
            </ng-container>
        </main>
    </div>
</div>
