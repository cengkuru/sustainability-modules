<div class="bg-primary min-h-screen font-inter text-accent">
    <!-- Mobile Sidebar Toggle -->
    <button (click)="toggleSidebar()" class="md:hidden fixed top-4 left-4 z-50 bg-accent6 text-primary p-2 rounded-full shadow-apple-md transition duration-250 ease-apple hover:bg-accent6/90 active:scale-95">
        <i class="bi" [ngClass]="{'bi-list': !isSidebarOpen, 'bi-x': isSidebarOpen}"></i>
    </button>

    <div class="flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside [@sidebarAnimation]="isSidebarOpen ? 'open' : 'closed'"
               class="w-full md:w-64 lg:w-80 bg-primary-100 fixed md:sticky top-0 h-screen overflow-y-auto transition-transform duration-300 ease-apple z-40 md:translate-x-0 shadow-apple-lg md:shadow-none"
               [ngClass]="{'translate-x-0': isSidebarOpen, '-translate-x-full md:translate-x-0': !isSidebarOpen}">
            <div class="p-6">
                <!-- Search Bar -->
                <div class="mb-6 relative">
                    <i class="bi bi-search absolute left-3 top-1/2 transform -translate-y-1/2 text-accent4"></i>
                    <input
                            type="text"
                            [(ngModel)]="searchTerm"
                            placeholder="Search policy..."
                            class="w-full p-3 pl-10 rounded-apple border border-accent2 focus:outline-none focus:ring-2 focus:ring-accent6 bg-primary-200 text-accent placeholder-accent4"
                    >
                </div>

                <!-- Navigation -->
                <nav>
                    <ul [@listAnimation]="filteredSections.length" class="space-y-2">
                        <li *ngFor="let section of filteredSections"
                            (click)="setActiveSection(section.title)"
                            class="cursor-pointer rounded-apple transition-all duration-250 ease-apple"
                            [ngClass]="{'bg-accent6 text-primary shadow-apple-md': activeSection === section.title, 'hover:bg-accent-100 hover:text-accent': activeSection !== section.title}">
                            <a class="block px-4 py-3">
                                {{ section.title }}
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 md:p-8 mt-16 md:mt-0">
            <ng-container *ngFor="let section of filteredSections">
                <section *ngIf="activeSection === section.title" [@fadeInOut] class="max-w-3xl mx-auto space-y-8">
                    <header>
                        <h1 class="text-3xl font-bold mb-4">{{ section.title }}</h1>
                    </header>

                    <p class="text-lg text-accent4 leading-relaxed">{{ section.content }}</p>

                    <ng-container *ngIf="section.subsections">
                        <div *ngFor="let subsection of section.subsections" class="bg-primary-100 p-6 rounded-apple shadow-apple-sm space-y-3">
                            <h2 class="text-xl font-semibold text-accent flex items-center">
                                <i class="bi bi-info-circle mr-2 text-accent6"></i>
                                {{ subsection.title }}
                            </h2>
                            <p class="text-accent4 leading-relaxed">{{ subsection.content }}</p>
                        </div>
                    </ng-container>
                </section>
            </ng-container>
        </main>
    </div>
</div>
