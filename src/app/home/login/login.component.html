<!-- Main Container -->
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <!-- Login Card -->
        <div class="bg-white py-8 px-4 shadow-lg sm:rounded-lg sm:px-10">
            <!-- Header -->
            <div class="mb-8">
                <h2 class="text-center text-2xl font-bold text-gray-900">
                    Sign in to your account
                </h2>
            </div>

            <!-- Login Form -->
            <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-6">
                <!-- Error Message -->
                <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-md">
                    <p class="text-sm text-red-600">{{ errorMessage }}</p>
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">
                        Email address
                    </label>
                    <div class="mt-1">
                        <input 
                            id="email"
                            type="email" 
                            formControlName="email"
                            autocomplete="email"
                            required
                            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-accent-color-base focus:border-accent-color-base focus:z-10 sm:text-sm"
                            [class.border-red-300]="isFieldInvalid('email')"
                            placeholder="Enter your email"
                        >
                    </div>
                    <div *ngIf="isFieldInvalid('email')" class="text-xs text-red-600 mt-1">
                        {{ getFieldError('email') }}
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        Password
                    </label>
                    <div class="relative mt-1">
                        <input 
                            id="password"
                            [type]="showPassword ? 'text' : 'password'"
                            formControlName="password"
                            autocomplete="current-password"
                            required
                            class="appearance-none relative block w-full px-3 py-2 pr-10 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-accent-color-base focus:border-accent-color-base focus:z-10 sm:text-sm"
                            [class.border-red-300]="isFieldInvalid('password')"
                            placeholder="Enter your password"
                        >
                        <button 
                            type="button"
                            (click)="togglePasswordVisibility()"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center"
                            tabindex="-1"
                        >
                            <i class="bi text-gray-400 hover:text-gray-600" 
                               [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                        </button>
                    </div>
                    <div *ngIf="isFieldInvalid('password')" class="text-xs text-red-600 mt-1">
                        {{ getFieldError('password') }}
                    </div>
                </div>


                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input 
                            id="remember-me"
                            formControlName="rememberMe"
                            type="checkbox"
                            class="h-4 w-4 text-accent-color-base focus:ring-accent-color-base border-gray-300 rounded"
                        >
                        <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                            Remember me
                        </label>
                    </div>

                    <div class="text-sm">
                        <a routerLink="../forgot-password" class="font-medium text-accent-color-base hover:text-accent-color-dark">
                            Forgot your password?
                        </a>
                    </div>
                </div>

                <!-- Submit Button -->
                <div>
                    <button 
                        type="submit"
                        [disabled]="!loginForm.valid || isLoading"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-accent-color-base hover:bg-accent-color-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-color-base disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
                    >
                        <span *ngIf="!isLoading">Sign in</span>
                        <span *ngIf="isLoading" class="flex items-center">
                            <i class="bi bi-arrow-repeat animate-spin mr-2"></i>
                            Signing in...
                        </span>
                    </button>
                </div>

                <!-- Register Link -->
                <div class="text-center">
                    <p class="text-sm text-gray-600">
                        Don't have an account?
                        <a routerLink="../register" class="font-medium text-accent-color-base hover:text-accent-color-dark">
                            Register here
                        </a>
                    </p>
                </div>

                <!-- Back to Home -->
                <div class="text-center">
                    <a routerLink="/" class="text-sm text-gray-600 hover:text-gray-900">
                        <i class="bi bi-arrow-left mr-1"></i>
                        Back to Home
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
