<!-- Main Container -->
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <!-- Card -->
        <div class="bg-white py-8 px-4 shadow-lg sm:rounded-lg sm:px-10">
            <!-- Header -->
            <div class="mb-8">
                <h2 class="text-center text-2xl font-bold text-gray-900">
                    Reset your password
                </h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
            </div>

            <!-- Success Message -->
            <div *ngIf="successMessage" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-md">
                <p class="text-sm text-green-600">{{ successMessage }}</p>
            </div>

            <!-- Error Message -->
            <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-md">
                <p class="text-sm text-red-600">{{ errorMessage }}</p>
            </div>

            <!-- Form -->
            <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetEmail()" class="space-y-6">
                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">
                        Email address
                    </label>
                    <input 
                        id="email"
                        type="email" 
                        formControlName="email"
                        autocomplete="email"
                        required
                        class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-accent-color-base focus:border-accent-color-base focus:z-10 sm:text-sm"
                        [class.border-red-300]="isFieldInvalid('email')"
                        placeholder="Enter your email address"
                    >
                    <div *ngIf="isFieldInvalid('email')" class="text-xs text-red-600 mt-1">
                        {{ getFieldError('email') }}
                    </div>
                </div>

                <!-- Submit Button -->
                <div>
                    <button 
                        type="submit"
                        [disabled]="!forgotPasswordForm.valid || isLoading"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-accent-color-base hover:bg-accent-color-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-color-base disabled:bg-gray-400 disabled:cursor-not-allowed"
                    >
                        <span *ngIf="!isLoading">Send reset link</span>
                        <span *ngIf="isLoading" class="flex items-center">
                            <i class="bi bi-arrow-repeat animate-spin mr-2"></i>
                            Sending...
                        </span>
                    </button>
                </div>

                <!-- Back to Login -->
                <div class="text-center">
                    <a routerLink="../login" class="text-sm text-gray-600 hover:text-gray-900">
                        <i class="bi bi-arrow-left mr-1"></i>
                        Back to login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
