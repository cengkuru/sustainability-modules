<div class="container mx-auto px-4 py-8">
    <!-- Universal Filters -->
    <div class="bg-white rounded-apple-lg shadow-apple-md p-6 mb-8">
        <h2 class="text-2xl font-semibold text-accent mb-4">Filters</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label for="region" class="block text-sm font-medium text-accent4">Region</label>
                <select id="region" [(ngModel)]="selectedRegion" (change)="applyFilters()" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50">
                    <option *ngFor="let region of regions" [value]="region">{{region}}</option>
                </select>
            </div>
            <div>
                <label for="sector" class="block text-sm font-medium text-accent4">Sector</label>
                <select id="sector" [(ngModel)]="selectedSector" (change)="applyFilters()" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50">
                    <option *ngFor="let sector of sectors" [value]="sector">{{sector}}</option>
                </select>
            </div>
            <div>
                <label for="climateObjective" class="block text-sm font-medium text-accent4">Climate Objective</label>
                <select id="climateObjective" [(ngModel)]="selectedClimateObjective" (change)="applyFilters()" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50">
                    <option *ngFor="let objective of climateObjectives" [value]="objective">{{objective}}</option>
                </select>
            </div>
            <div>
                <label for="yearRange" class="block text-sm font-medium text-accent4">Year Range</label>
                <div class="flex items-center space-x-2">
                    <input type="number" [(ngModel)]="startYear" (change)="applyFilters()" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50" min="{{startYear}}" max="{{endYear}}">
                    <span>to</span>
                    <input type="number" [(ngModel)]="endYear" (change)="applyFilters()" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-accent6 focus:ring focus:ring-accent6 focus:ring-opacity-50" min="{{startYear}}" max="{{endYear}}">
                </div>
            </div>
        </div>
    </div>

    <!-- Key Metrics -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
        <div class="bg-white rounded-apple-lg shadow-apple-md p-8 transition duration-300 ease-apple-ease-out hover:shadow-apple-lg apple-hover-lift">
            <div class="flex items-center mb-6">
                <i class="bi bi-folder2-open text-accent6 text-3xl mr-3"></i>
                <h2 class="text-2xl font-semibold text-accent">Total Projects</h2>
            </div>
            <p class="text-4xl font-bold text-accent mb-3">{{totalProjects}}</p>
            <p class="text-base text-accent4 mb-4">from {{regions.length - 1}} Regions</p>
        </div>


        <div class="bg-white rounded-apple-lg shadow-apple-md p-8 transition duration-300 ease-apple-ease-out hover:shadow-apple-lg apple-hover-lift">
            <div class="flex items-center mb-6">
                <i class="bi bi-people text-accent6 text-3xl mr-3"></i>
                <h2 class="text-2xl font-semibold text-accent">Jobs Created</h2>
            </div>
            <p class="text-4xl font-bold text-accent mb-3">{{jobsCreated | number}}</p>
            <p class="text-base text-accent4 mb-4">estimated</p>
        </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Total Projects by Sector Chart -->
        <div class="bg-white rounded-apple-lg shadow-apple-md p-6">
            <h3 class="text-xl font-semibold text-accent mb-4">Total Projects by Sector</h3>
            <div id="totalProjectsBySectorChart" style="width: 100%; height: 400px;"></div>
        </div>

        <!-- Infrastructure Investment Chart -->
        <div class="bg-white rounded-apple-lg shadow-apple-md p-6">
            <h3 class="text-xl font-semibold text-accent mb-4">Infrastructure Investment by Sector</h3>
            <div id="infrastructureInvestmentChart" style="width: 100%; height: 400px;"></div>
        </div>

        <!-- Investment by Region Chart -->
        <div class="bg-white rounded-apple-lg shadow-apple-md p-6">
            <div id="investmentByRegionChart" style="width: 100%; height: 400px;"></div>
        </div>

        <!-- Investments by Climate Objectives Chart -->
        <div class="bg-white rounded-apple-lg shadow-apple-md p-6">
            <div id="investmentsByClimateObjectivesChart" style="width: 100%; height: 400px;"></div>
        </div>


    </div>

    <!-- Map -->
    <div class="mt-8 bg-white rounded-apple-lg shadow-apple-md p-6">
        <div #mapContainer style="height: 400px;"></div>
    </div>
</div>
