<div class="min-h-full bg-primary text-accent font-inter">
    <header class="bg-primary shadow-apple-md">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <nav class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="https://infrastructuretransparency.org/" target="_blank" class="flex-shrink-0">
                        <img class="h-32 lg:h-[160px] xl:h-[200px] w-auto" src="../../../assets/cost-logo.png" alt="Prototype">
                    </a>
                </div>

                <!-- Desktop navigation -->
                <div class="hidden md:block">
                    <div class="flex items-center space-x-4">
                        <a *ngFor="let link of navLinks" [routerLink]="link.path" routerLinkActive="text-secondary" [routerLinkActiveOptions]="{exact: true}" class="px-3 py-2 rounded-apple-md text-sm font-medium hover:bg-accent hover:bg-opacity-10 transition-colors duration-250 ease-apple-ease">
                            <i class="bi {{link.icon}} mr-2"></i>{{ link.label }}
                        </a>
                    </div>
                </div>

                <div class="flex items-center">
                    <!-- Profile dropdown for desktop -->
                    <div class="relative hidden md:block" *ngIf="isLoggedIn; else loginButtonDesktop">
                        <button (click)="toggleProfileDropdown()" type="button" class="flex items-center rounded-full bg-accent1 text-accent p-1 hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-accent6" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
                            <span class="sr-only">Open user menu</span>
                            <img class="h-8 w-8 rounded-full" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="">
                        </button>
                        <div *ngIf="isProfileDropdownOpen" class="absolute right-0 mt-2 w-48 bg-primary rounded-apple-md shadow-apple-lg ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
                            <a href="#" class="block px-4 py-2 text-sm text-accent hover:bg-accent hover:bg-opacity-10 transition-colors duration-250 ease-apple-ease" role="menuitem">Your Profile</a>
                            <a href="#" class="block px-4 py-2 text-sm text-accent hover:bg-accent hover:bg-opacity-10 transition-colors duration-250 ease-apple-ease" role="menuitem">Sign out</a>
                        </div>
                    </div>
                    <ng-template #loginButtonDesktop>
                        <button (click)="login()" class="hidden md:block text-accent bg-accent1 rounded-apple-md px-4 py-2 text-sm font-medium hover:bg-opacity-90 transition-colors duration-250 ease-apple-ease">Login</button>
                    </ng-template>

                    <!-- Mobile menu button -->
                    <button (click)="toggleMobileMenu()" type="button" class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-accent hover:bg-accent hover:bg-opacity-10 focus:outline-none focus:ring-2 focus:ring-accent6" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <i [class.hidden]="isMobileMenuOpen" class="bi bi-list block h-6 w-6" aria-hidden="true"></i>
                        <i [class.hidden]="!isMobileMenuOpen" class="bi bi-x block h-6 w-6" aria-hidden="true"></i>
                    </button>
                </div>
            </nav>
        </div>

        <!-- Mobile menu -->
        <div class="md:hidden" *ngIf="isMobileMenuOpen">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a *ngFor="let link of navLinks" [routerLink]="link.path" routerLinkActive="bg-accent text-primary" [routerLinkActiveOptions]="{exact: true}" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-accent hover:bg-opacity-10 transition-colors duration-250 ease-apple-ease" (click)="closeMobileMenu()">
                    <i class="bi {{link.icon}} mr-2"></i>{{ link.label }}
                </a>
            </div>
            <div class="pt-4 pb-3 border-t border-accent border-opacity-20">
                <div class="flex items-center px-5" *ngIf="isLoggedIn; else loginButtonMobile">
                    <div class="flex-shrink-0">
                        <img class="h-10 w-10 rounded-full" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="">
                    </div>
                    <div class="ml-3">
                        <div class="text-base font-medium text-accent">Tom Cook</div>
                        <div class="text-sm font-medium text-accent opacity-75">{{'tom@example.com'}}</div>
                    </div>
                </div>
                <div class="mt-3 px-2 space-y-1">
                    <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-accent hover:bg-accent hover:bg-opacity-10 transition-colors duration-250 ease-apple-ease">Your Profile</a>
                    <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-accent hover:bg-accent hover:bg-opacity-10 transition-colors duration-250 ease-apple-ease">Sign out</a>
                </div>
                <ng-template #loginButtonMobile>
                    <div class="mt-3 px-2">
                        <button (click)="login()" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-accent bg-accent1 hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent6 transition-colors duration-250 ease-apple-ease">Login</button>
                    </div>
                </ng-template>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <router-outlet></router-outlet>
    </main>

    <footer class="bg-accent text-primary">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col items-center justify-between sm:flex-row">
                <div class="mb-4 sm:mb-0">
                    <span class="text-sm">&copy; {{currentYear}} {{owner}}. All rights reserved.</span>
                </div>
                <div class="flex flex-wrap justify-center sm:justify-end gap-4">
                    <a *ngFor="let link of footerLinks" [routerLink]="link.path" class="flex items-center text-sm hover:text-accent1 transition-colors duration-250 ease-apple-ease">
                        <i class="bi {{link.icon}} mr-2"></i>
                        <span>{{link.label}}</span>
                    </a>
                    <a [href]="creativeCommonsLicense.link" target="_blank" rel="license noopener noreferrer" class="flex items-center text-sm hover:text-accent1 transition-colors duration-250 ease-apple-ease">
                        <i class="bi {{creativeCommonsLicense.icon}} mr-2"></i>
                        <span>{{creativeCommonsLicense.name}}</span>
                    </a>
                </div>
            </div>
        </div>
    </footer>
</div>
