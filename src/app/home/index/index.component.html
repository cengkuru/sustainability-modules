<div class="min-h-full bg-primary text-accent font-inter">
    <!-- Enhanced Header -->
    <header class="fixed w-full top-0 z-50 bg-primary bg-opacity-90 backdrop-filter backdrop-blur-lg shadow-apple-md transition-all duration-300 ease-apple" [class.translate-y-[-100%)]="!isHeaderVisible">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <nav class="flex items-center justify-between h-20">
                <div class="flex items-center">
                    <a href="/" target="_blank" class="flex-shrink-0 transform hover:scale-105 transition-all duration-300 ease-apple">
                        <img class="h-12 w-auto" src="../../../assets/logo.png" alt="Prototype">
                    </a>
                </div>

                <!-- Desktop navigation -->
                <div class="hidden md:block">
                    <div class="flex items-center space-x-1">
                        <a *ngFor="let link of navLinks" [routerLink]="link.path" routerLinkActive="bg-accent6 text-primary" [routerLinkActiveOptions]="{exact: true}" class="px-4 py-2 rounded-apple-lg text-sm font-medium hover:bg-accent hover:bg-opacity-10 transition-all duration-300 ease-apple hover:scale-105 flex items-center">
                            <i [class]="link.icon + ' mr-2 text-lg'"></i>{{ link.label }}
                        </a>
                    </div>
                </div>

                <div class="flex items-center space-x-4">


                    <!-- Profile dropdown for desktop -->
                    <div class="relative hidden md:block" *ngIf="isLoggedIn; else loginButtonDesktop">
                        <button (click)="toggleProfileDropdown()" type="button" class="flex items-center rounded-full bg-accent1 text-accent p-2 hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-accent6 transition-all duration-300 ease-apple hover:scale-105" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
                            <span class="sr-only">Open user menu</span>
                            <i class="bi bi-person-circle text-2xl"></i>
                        </button>
                        <div *ngIf="isProfileDropdownOpen" [@fadeInOut] class="absolute right-0 mt-2 w-48 bg-primary rounded-apple-lg shadow-apple-xl ring-1 ring-black ring-opacity-5 focus:outline-none overflow-hidden" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
                            <a href="#" class="block px-4 py-3 text-sm text-accent hover:bg-accent6 hover:text-primary transition-all duration-300 ease-apple" role="menuitem">Your Profile</a>
                            <a href="#" class="block px-4 py-3 text-sm text-accent hover:bg-accent6 hover:text-primary transition-all duration-300 ease-apple" role="menuitem">Sign out</a>
                        </div>
                    </div>
                    <ng-template #loginButtonDesktop>
                        <button (click)="login()" class="hidden md:flex items-center text-primary bg-accent6 rounded-apple-lg px-4 py-2 text-sm font-medium hover:bg-opacity-90 transition-all duration-300 ease-apple hover:scale-105">
                            <i class="bi bi-box-arrow-in-right mr-2 text-lg"></i>Login
                        </button>
                    </ng-template>

                    <!-- Mobile menu button -->
                    <button (click)="toggleMobileMenu()" type="button" class="md:hidden inline-flex items-center justify-center p-2 rounded-apple-lg text-accent hover:bg-accent hover:bg-opacity-10 focus:outline-none focus:ring-2 focus:ring-accent6 transition-all duration-300 ease-apple" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <i [class]="isMobileMenuOpen ? 'bi bi-x-lg' : 'bi bi-list'" class="text-2xl"></i>
                    </button>
                </div>
            </nav>
        </div>

        <!-- Enhanced Mobile menu -->
        <div class="md:hidden" *ngIf="isMobileMenuOpen" [@fadeInOut]>
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a *ngFor="let link of navLinks" [routerLink]="link.path" routerLinkActive="bg-accent6 text-primary" [routerLinkActiveOptions]="{exact: true}" class="flex items-center px-3 py-2 rounded-apple-lg text-base font-medium hover:bg-accent hover:bg-opacity-10 transition-all duration-300 ease-apple" (click)="closeMobileMenu()">
                    <i [class]="link.icon + ' mr-2 text-lg'"></i>{{ link.label }}
                </a>
            </div>
            <div class="pt-4 pb-3 border-t border-accent border-opacity-20">
                <div class="flex items-center px-5" *ngIf="isLoggedIn; else loginButtonMobile">
                    <div class="flex-shrink-0">
                        <i class="bi bi-person-circle text-3xl"></i>
                    </div>
                    <div class="ml-3">
                        <div class="text-base font-medium text-accent">Tom Cook</div>
                        <div class="text-sm font-medium text-accent opacity-75">{{'email@example.com'}}</div>
                    </div>
                </div>
                <div class="mt-3 px-2 space-y-1">
                    <a href="#" class="block px-3 py-2 rounded-apple-lg text-base font-medium text-accent hover:bg-accent hover:bg-opacity-10 transition-all duration-300 ease-apple">Your Profile</a>
                    <a href="#" class="block px-3 py-2 rounded-apple-lg text-base font-medium text-accent hover:bg-accent hover:bg-opacity-10 transition-all duration-300 ease-apple">Sign out</a>
                </div>
                <ng-template #loginButtonMobile>
                    <div class="mt-3 px-2">
                        <button (click)="login()" class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-apple-lg shadow-sm text-sm font-medium text-primary bg-accent6 hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent6 transition-all duration-300 ease-apple">
                            <i class="bi bi-box-arrow-in-right mr-2 text-lg"></i>Login
                        </button>
                    </div>
                </ng-template>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8 mt-20">
        <router-outlet></router-outlet>
    </main>

    <!-- Enhanced Footer -->
    <footer class="bg-accent text-primary">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col items-center justify-between sm:flex-row">
                <div class="mb-6 sm:mb-0">
                    <img src="../../../assets/logo-white.png" alt="Logo" class="h-10 w-auto mb-4">
                    <p class="text-sm opacity-80">&copy; {{currentYear}} {{owner}}. All rights reserved.</p>
                </div>
                <div class="flex flex-wrap justify-center sm:justify-end gap-6">
                    <div class="space-y-2">
                        <h3 class="font-semibold mb-2">Navigation</h3>
                        <a *ngFor="let link of navLinks" [routerLink]="link.path" class="block text-sm hover:text-accent1 transition-all duration-300 ease-apple hover:translate-x-1">
                            {{link.label}}
                        </a>
                    </div>
                    <div class="space-y-2">
                        <h3 class="font-semibold mb-2">Legal</h3>
                        <a *ngFor="let link of footerLinks" [routerLink]="link.path" class="block text-sm hover:text-accent1 transition-all duration-300 ease-apple hover:translate-x-1">
                            {{link.label}}
                        </a>
                        <a [href]="creativeCommonsLicense.link" target="_blank" rel="license noopener noreferrer" class="flex items-center text-sm hover:text-accent1 transition-all duration-300 ease-apple hover:translate-x-1">
                            <img src="../../../assets/ccheart_red.svg" alt="Creative Commons License" class="h-4 w-auto mr-2">
                            {{creativeCommonsLicense.name}}
                        </a>
                    </div>
                    <div class="space-y-2">
                        <h3 class="font-semibold mb-2">Connect</h3>
                        <a target="_blank" href="https://x.com/CoSTransparency" class="block text-sm hover:text-accent1 transition-all duration-300 ease-apple hover:translate-x-1">
                            <i class="bi bi-x mr-2"></i>X (formerly: Twitter)
                        </a>
                        <a target="_blank" href="https://www.linkedin.com/company/costransparency/" class="block text-sm hover:text-accent1 transition-all duration-300 ease-apple hover:translate-x-1">
                            <i class="bi bi-linkedin mr-2"></i>LinkedIn
                        </a>
                        <a target="_blank" href="https://www.facebook.com/CoSTransparency" class="block text-sm hover:text-accent1 transition-all duration-300 ease-apple hover:translate-x-1">
                            <i class="bi bi-facebook mr-2"></i>Facebook
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</div>
