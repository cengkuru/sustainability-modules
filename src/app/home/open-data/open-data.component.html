<div class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 bg-primary text-accent">
    <div class="w-full max-w-4xl mx-auto p-6">
        <div class="bg-white rounded-2xl shadow-md overflow-hidden transition-all duration-300 hover:shadow-lg">
            <div class="px-6 py-8 sm:px-8">
                <h2 class="text-3xl md:text-4xl font-bold text-center mb-6 text-accent">Download Infrastructure Project Data</h2>

                <!-- Creative Commons License -->
                <div class="mb-8 p-4 bg-accent5 bg-opacity-10 rounded-xl flex items-center justify-center space-x-4">
                    <img src="../../../assets/ccheart_red.svg" alt="Creative Commons License" class="h-6 w-auto">
                    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license noopener noreferrer" class="text-sm font-medium hover:text-accent1 transition-all duration-300 ease-in-out">
                        This work is licensed under a Creative Commons Attribution 4.0 International License
                    </a>
                </div>

                <!-- File list and download options -->
                <ul class="space-y-4">
                    <li *ngFor="let file of dataFiles" class="bg-gray-50 p-4 rounded-xl transition-all duration-300 hover:bg-gray-100">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between space-y-3 sm:space-y-0">
                            <span class="text-lg font-semibold text-accent">{{ file.name }}</span>
                            <div class="flex flex-wrap gap-2">
                                <button *ngFor="let format of downloadFormats"
                                        (click)="downloadFile(file.id, format.type)"
                                        [disabled]="downloading"
                                        class="px-4 py-2 text-sm font-medium rounded-md transition-all duration-250 shadow-sm hover:shadow-md disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent1"
                                        [ngClass]="{'bg-accent1 text-white hover:bg-accent2': !downloading, 'bg-gray-300 text-gray-500': downloading}">
                                    {{ format.label }}
                                </button>
                            </div>
                        </div>
                    </li>
                </ul>

                <div *ngIf="error" class="mt-8 p-4 bg-red-100 border border-red-400 text-red-700 rounded-xl animate-fade-in">
                    {{ error }}
                </div>
            </div>
            <div *ngIf="downloading" class="bg-accent5 bg-opacity-70 backdrop-filter backdrop-blur-lg px-6 py-4 flex items-center justify-center animate-fade-in">
                <i class="bi bi-arrow-repeat animate-spin text-accent6 mr-3"></i>
                <span class="text-sm font-medium text-accent6">Preparing your download...</span>
            </div>
        </div>
    </div>
</div>
