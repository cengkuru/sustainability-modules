<div class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 bg-primary text-accent">
    <div class="w-full max-w-4xl">
        <div class="bg-white rounded-apple-lg shadow-apple-md overflow-hidden transition-all duration-300 hover:shadow-apple-lg">
            <div class="px-6 py-12 sm:px-12">
                <h2 class="text-3xl md:text-4xl font-bold text-center mb-6 text-accent">Download Project Data</h2>
                <p class="mt-4 text-lg md:text-xl text-center mb-10 text-accent4 max-w-2xl mx-auto leading-relaxed">
                    Access comprehensive project data in bulk. Choose your preferred open format for transparency and analysis:
                </p>
                
                <!-- File list and download options -->
                <ul class="space-y-4">
                    <li *ngFor="let file of dataFiles" class="bg-accent5 bg-opacity-10 p-4 rounded-apple">
                        <div class="flex items-center justify-between">
                            <span class="text-lg font-semibold text-accent">{{ file.name }}</span>
                            <div class="flex space-x-2">
                                <button *ngFor="let format of downloadFormats"
                                        (click)="downloadFile(file.id, format.type)"
                                        [disabled]="downloading"
                                        class="px-3 py-1 text-sm font-medium rounded-full transition-all duration-250 shadow-apple-sm hover:shadow-apple-md disabled:opacity-50 disabled:cursor-not-allowed"
                                        [ngClass]="{'bg-accent6 text-primary hover:bg-accent5': !downloading, 'bg-gray-300 text-gray-500': downloading}">
                                    {{ format.label }}
                                </button>
                            </div>
                        </div>
                    </li>
                </ul>

                <div *ngIf="error" class="mt-8 p-4 bg-secondary bg-opacity-10 border border-secondary text-secondary rounded-apple animate-fade-in">
                    {{ error }}
                </div>
            </div>
            <div *ngIf="downloading" class="bg-accent5 bg-opacity-70 backdrop-filter backdrop-blur-lg px-6 py-4 flex items-center justify-center animate-fade-in">
                <i class="bi bi-arrow-repeat animate-spin text-accent6 mr-3"></i>
                <span class="text-sm text-accent6">Preparing your download...</span>
            </div>
        </div>
    </div>
</div>
