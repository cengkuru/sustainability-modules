<div class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 bg-primary font-inter text-accent">
    <div class="w-full max-w-3xl">
        <div class="bg-white rounded-apple-lg shadow-apple-xl overflow-hidden">
            <div class="px-6 py-12 sm:px-12">
                <h2 class="text-4xl font-bold text-center mb-8 text-accent">Download Project Data</h2>
                <p class="mt-4 text-lg text-center mb-12 text-accent3 max-w-2xl mx-auto">
                    Access all project data in bulk. Choose your preferred open format:
                </p>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-6">
                    <button (click)="downloadFile('csv')" [disabled]="downloading" class="download-button flex flex-col items-center justify-center p-6 rounded-apple-md bg-accent2 text-accent3 hover:bg-accent1 transition-all duration-300 ease-apple-ease-out disabled:opacity-50 disabled:cursor-not-allowed apple-hover-lift">
                        <i class="bi bi-file-earmark-spreadsheet text-4xl mb-4"></i>
                        <span class="font-semibold">CSV</span>
                    </button>
                    <button (click)="downloadFile('json')" [disabled]="downloading" class="download-button flex flex-col items-center justify-center p-6 rounded-apple-md bg-accent2 text-accent3 hover:bg-accent1 transition-all duration-300 ease-apple-ease-out disabled:opacity-50 disabled:cursor-not-allowed apple-hover-lift">
                        <i class="bi bi-file-earmark-code text-4xl mb-4"></i>
                        <span class="font-semibold">JSON</span>
                    </button>
                    <button (click)="downloadFile('txt')" [disabled]="downloading" class="download-button flex flex-col items-center justify-center p-6 rounded-apple-md bg-accent2 text-accent3 hover:bg-accent1 transition-all duration-300 ease-apple-ease-out disabled:opacity-50 disabled:cursor-not-allowed apple-hover-lift">
                        <i class="bi bi-file-earmark-text text-4xl mb-4"></i>
                        <span class="font-semibold">TXT</span>
                    </button>
                    <button (click)="downloadFile('xlsx')" [disabled]="downloading" class="download-button flex flex-col items-center justify-center p-6 rounded-apple-md bg-accent2 text-accent3 hover:bg-accent1 transition-all duration-300 ease-apple-ease-out disabled:opacity-50 disabled:cursor-not-allowed apple-hover-lift">
                        <i class="bi bi-file-earmark-excel text-4xl mb-4"></i>
                        <span class="font-semibold">Excel</span>
                    </button>
                </div>
                <div *ngIf="error" class="mt-8 text-secondary text-center">
                    {{ error }}
                </div>
            </div>
            <div *ngIf="downloading" class="apple-glass px-6 py-4 flex items-center justify-center">
                <i class="bi bi-arrow-repeat animate-spin text-xl mr-3 text-accent6"></i>
                <span class="text-sm text-accent6">Downloading...</span>
            </div>
        </div>
    </div>
</div>
