<!-- Main Container -->
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <!-- Card -->
        <div class="bg-white py-8 px-4 shadow-lg sm:rounded-lg sm:px-10">
            <!-- Header -->
            <div class="mb-8">
                <h2 class="text-center text-2xl font-bold text-gray-900">
                    Create new password
                </h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Enter your new password below
                </p>
            </div>

            <!-- Success Message -->
            <div *ngIf="successMessage" class="mb-4 p-3 bg-green-50 border border-green-200 rounded-md">
                <p class="text-sm text-green-600">{{ successMessage }}</p>
            </div>

            <!-- Error Message -->
            <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-md">
                <p class="text-sm text-red-600">{{ errorMessage }}</p>
            </div>

            <!-- Form -->
            <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()" class="space-y-6">
                <!-- New Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        New Password
                    </label>
                    <div class="relative mt-1">
                        <input 
                            id="password"
                            [type]="showPassword ? 'text' : 'password'"
                            formControlName="password"
                            autocomplete="new-password"
                            required
                            class="appearance-none relative block w-full px-3 py-2 pr-10 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-accent-color-base focus:border-accent-color-base focus:z-10 sm:text-sm"
                            [class.border-red-300]="isFieldInvalid('password')"
                            placeholder="Enter new password"
                        >
                        <button 
                            type="button"
                            (click)="togglePasswordVisibility('password')"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center"
                            tabindex="-1"
                        >
                            <i class="bi text-gray-400 hover:text-gray-600" 
                               [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                        </button>
                    </div>
                    <div *ngIf="isFieldInvalid('password')" class="text-xs text-red-600 mt-1">
                        {{ getFieldError('password') }}
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700">
                        Confirm Password
                    </label>
                    <div class="relative mt-1">
                        <input 
                            id="confirmPassword"
                            [type]="showConfirmPassword ? 'text' : 'password'"
                            formControlName="confirmPassword"
                            autocomplete="new-password"
                            required
                            class="appearance-none relative block w-full px-3 py-2 pr-10 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-accent-color-base focus:border-accent-color-base focus:z-10 sm:text-sm"
                            [class.border-red-300]="isFieldInvalid('confirmPassword')"
                            placeholder="Confirm new password"
                        >
                        <button 
                            type="button"
                            (click)="togglePasswordVisibility('confirm')"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center"
                            tabindex="-1"
                        >
                            <i class="bi text-gray-400 hover:text-gray-600" 
                               [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                        </button>
                    </div>
                    <div *ngIf="isFieldInvalid('confirmPassword')" class="text-xs text-red-600 mt-1">
                        {{ getFieldError('confirmPassword') }}
                    </div>
                </div>

                <!-- Password Requirements -->
                <div class="text-xs text-gray-600">
                    <p class="font-medium mb-1">Password must contain:</p>
                    <ul class="space-y-1">
                        <li [class.text-green-600]="hasMinLength">
                            <i class="bi" [ngClass]="hasMinLength ? 'bi-check-circle-fill' : 'bi-circle'"></i>
                            At least 8 characters
                        </li>
                        <li [class.text-green-600]="hasUpperCase">
                            <i class="bi" [ngClass]="hasUpperCase ? 'bi-check-circle-fill' : 'bi-circle'"></i>
                            One uppercase letter
                        </li>
                        <li [class.text-green-600]="hasLowerCase">
                            <i class="bi" [ngClass]="hasLowerCase ? 'bi-check-circle-fill' : 'bi-circle'"></i>
                            One lowercase letter
                        </li>
                        <li [class.text-green-600]="hasNumber">
                            <i class="bi" [ngClass]="hasNumber ? 'bi-check-circle-fill' : 'bi-circle'"></i>
                            One number
                        </li>
                    </ul>
                </div>

                <!-- Submit Button -->
                <div>
                    <button 
                        type="submit"
                        [disabled]="!resetPasswordForm.valid || isLoading"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-accent-color-base hover:bg-accent-color-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-color-base disabled:bg-gray-400 disabled:cursor-not-allowed"
                    >
                        <span *ngIf="!isLoading">Reset password</span>
                        <span *ngIf="isLoading" class="flex items-center">
                            <i class="bi bi-arrow-repeat animate-spin mr-2"></i>
                            Resetting...
                        </span>
                    </button>
                </div>

                <!-- Back to Login -->
                <div class="text-center">
                    <a routerLink="../login" class="text-sm text-gray-600 hover:text-gray-900">
                        <i class="bi bi-arrow-left mr-1"></i>
                        Back to login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
