<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 mt-12 font-inter">
    <!-- Loading State -->
    <div *ngIf="isLoading" class="fixed inset-0 flex items-center justify-center bg-primary bg-opacity-75 backdrop-blur-sm z-50" @fadeInAnimation>
        <div class="w-16 h-16 border-4 border-accent2 border-t-accent6 rounded-full animate-spin"></div>
    </div>

    <div class="container mx-auto py-8">
        <h1 class="text-4xl font-bold text-accent mb-8 text-center">Projects</h1>

        <div class="max-w-2xl mx-auto mb-12">
            <div class="relative mb-8">
                <input
                        type="text"
                        class="w-full px-4 py-3 pl-12 rounded-full bg-accent2 bg-opacity-20 border-none focus:outline-none focus:ring-2 focus:ring-accent6 transition-all duration-250 ease-apple-ease text-accent placeholder-accent4"
                        placeholder="Search projects..."
                        (input)="onSearchChange($event)"
                />
                <svg class="w-6 h-6 text-accent4 absolute left-4 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>

            <div class="flex justify-center">
                <div class="inline-flex rounded-full bg-accent2 bg-opacity-20 p-1">
                    <button
                            (click)="toggleFeatured()"
                            [class.bg-primary]="!(showFeatured | async)"
                            [class.shadow-apple-sm]="!(showFeatured | async)"
                            class="px-6 py-2 rounded-full text-sm font-medium text-accent transition-all duration-250 ease-apple-ease"
                    >
                        All Projects
                    </button>
                    <button
                            (click)="toggleFeatured()"
                            [class.bg-primary]="showFeatured | async"
                            [class.shadow-apple-sm]="showFeatured | async"
                            class="px-6 py-2 rounded-full text-sm font-medium text-accent transition-all duration-250 ease-apple-ease"
                    >
                        Featured
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div *ngFor="let project of projects$ | async"
                 class="relative overflow-hidden rounded-2xl bg-primary shadow-apple-md transition-all duration-300 ease-apple-ease transform hover:-translate-y-1 hover:shadow-apple-lg group">
                <div class="p-6">
                    <a [routerLink]="['/public/projects', project.id]" class="block">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-semibold text-accent group-hover:text-accent6 transition-colors duration-250 ease-apple-ease">{{ project.name }}</h3>
                            <svg class="w-6 h-6 text-accent4 group-hover:text-accent6 transition-colors duration-250 ease-apple-ease transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                        </div>
                        <p class="text-sm mb-4 text-accent4">
                            <svg class="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            {{ project.location.name }}
                        </p>
                        <p class="text-accent text-opacity-80 line-clamp-3">{{ project.stages.identification.basicData.projectDescription }}</p>
                    </a>
                    <div *ngIf="project.featured" class="absolute top-4 right-4">
                        <span class="bg-accent1 text-accent text-xs font-semibold px-3 py-1 rounded-full shadow-apple-sm">
                            Featured
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
